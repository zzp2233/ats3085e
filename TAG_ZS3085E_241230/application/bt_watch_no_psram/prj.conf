# 本文件为 bt_watch_no_psram 设置应用级 Kconfig 值，与板级默认值等输入合并后写入构建目录 zephyr/.config。
# 主应用与启动器。CONFIG_BT_MAIN_APP=y 使 src/CMakeLists.txt 进入 main 并编译命令表。Shell 框架及文件系统的最终值查 .config。
CONFIG_BT_MAIN_APP=y
CONFIG_LAUNCHER_APP=y

# 蓝牙通话，选择通话应用并支持 mSBC 宽带语音。
CONFIG_BT_CALL_APP=y
CONFIG_BT_HFP_MSBC=y

# 蓝牙音乐，启用播放器和 A2DP AAC 解码支持。
CONFIG_BT_PLAYER=y
CONFIG_BT_A2DP_AAC=y

# 本地音乐应用。下方以井号保留的候选配置不参与赋值。
CONFIG_LCMUSIC_APP=y
#CONFIG_FS_FATFS_NUM_FILES=16
# 本地音乐解码器，按音频编码格式分别启用。
CONFIG_DECODER_M4A=y
CONFIG_DECODER_APE=y
CONFIG_DECODER_PCM=y
CONFIG_DECODER_MP3=y
CONFIG_DECODER_FLAC=y
CONFIG_DECODER_WAV=y
CONFIG_DECODER_WMA=y
# 本地音乐文件解析器，用于识别封装格式并把数据交给解码器。
CONFIG_ACTIONS_PARSER=y
CONFIG_PARSER_MP3=y
CONFIG_PARSER_M4A=y
CONFIG_PARSER_WAV=y
CONFIG_PARSER_APE=y
CONFIG_PARSER_WMA=y
CONFIG_PARSER_FLAC=y

# 语音提示播放。
CONFIG_PLAYTTS=y

# 闹钟应用。
CONFIG_ALARM_APP=y

# 读卡器应用。
CONFIG_CARD_READER_APP=y

# 蓝牙厂商服务。
CONFIG_BT_VENDOR=y

# 炬芯媒体框架，选择音效输出模式、DSP 休眠与日志、镜像加载及录音编码器。
CONFIG_MEDIA=y
CONFIG_MEDIA_EFFECT_OUTMODE=2
CONFIG_MEDIA_DSP_SLEEP=y
CONFIG_DSP_DEBUG_PRINT=y
CONFIG_LOAD_IMAGE_FROM_FS=y
CONFIG_ENCODER_PCM=y
CONFIG_ENCODER_OPUS=y

# 图形界面，配置 UI 服务、显示表面和 UI 内存管理。
CONFIG_UI_MANAGER=y
CONFIG_UI_SERVICE=y
CONFIG_SURFACE_ZERO_BUFFER=y
CONFIG_UI_MEMORY_MANAGER=y
CONFIG_UI_MEMORY_DEBUG=n
CONFIG_MEM_GUARD=n

# 资源管理器，控制样式映射与预加载策略。
CONFIG_RES_MANAGER=y
CONFIG_RES_MANAGER_USE_STYLE_MMAP=y
CONFIG_RES_MANAGER_SKIP_PRELOAD=y

# FreeType 矢量字体支持。
CONFIG_FREETYPE_FONT=y

# 位图字体和表情字体，表情数据使用映射读取。
CONFIG_BITMAP_FONT=y
CONFIG_BITMAP_FONT_SUPPORT_EMOJI=y
CONFIG_EMOJI_FONT_USE_MMAP=y

# LVGL 图形库，配置显示缓冲、工作队列、图形加速、文本编码和所用控件。
CONFIG_LVGL=y
CONFIG_LVGL_USE_BITMAP_FONT=y
CONFIG_LVGL_USE_FREETYPE_FONT=y
CONFIG_LVGL_USE_RES_MANAGER=y
CONFIG_LVGL_DISPLAY_FLUSH_WORKQ_STACKSIZE=1280
CONFIG_LV_VDB_NUM=2
CONFIG_LV_USE_GPU_ACTS=y
CONFIG_LV_USE_GPU_ACTS_JPG=y
CONFIG_LV_USE_GPU_ACTS_SW_DECODER=y
CONFIG_LV_USE_STRACE=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_TXT_ENC_UTF8=y
CONFIG_LV_TXT_BREAK_CHARS=""
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y
CONFIG_LV_CONF_MINIMAL=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_GRID=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_BTN=y
CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_IMGBTN=y
CONFIG_LV_USE_TILEVIEW=y
CONFIG_LV_USE_QRCODE=y
CONFIG_LV_USE_BARCODE=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_IMGFONT=y

# 系统基础服务。时钟配置为每秒 1000 个系统 tick；本段也启用系统 Shell 功能、任务看门狗和崩溃转储。
CONFIG_ACTIONS_FRAMEWORK=y
CONFIG_ACTIONS_FRAMEWORK_DISPLAY=y
CONFIG_THREAD_TIMER=y
CONFIG_ACTIONS_UTILS=y
CONFIG_CORE=y
CONFIG_SYSTEM=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_PRINTK_TIME_FREFIX=n
CONFIG_SLEEP_SENSOR_RUN_ON_NOR=y
CONFIG_SLEEP_COPY_SRAM_FOR_SENSOR=n
CONFIG_SLEEP_MEMORY_CHECK_INTEGRITY=n
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SYSTEM_SHELL=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_TIMEOUT=10000
CONFIG_DEBUG_RAMDUMP=y
CONFIG_DEBUG_TRACEDUMP=n

# 电源管理。
CONFIG_POWER=y

# 输入设备与环形缓冲区。
CONFIG_INPUT=y
CONFIG_INPUT_POINTER=y
CONFIG_INPUT_KEYPAD=y
CONFIG_ACTS_RING_BUFFER=y

# 系统待机、自动待机时间（秒）与唤醒锁。
CONFIG_SYS_STANDBY=y
CONFIG_AUTO_STANDBY_TIME_SEC=10
CONFIG_SYS_WAKELOCK=y

# 异步消息槽位数和消息调试开关。
CONFIG_NUM_MBOX_ASYNC_MSGS=35
CONFIG_MESSAGE_DEBUG=n

# 属性存储与缓存。
CONFIG_PROPERTY=y
CONFIG_PROPERTY_CACHE=y

# 硬件看门狗驱动与复位模式的配置，与上文的任务看门狗分别设置。
CONFIG_WATCHDOG=n
CONFIG_WDOG_ACTS=n
CONFIG_WDT_MODE_RESET=n

# DVFS 动态电压与频率调节。
CONFIG_DVFS=y
CONFIG_ACTS_DVFS_DYNAMIC_LEVEL=y

# 系统内存管理、应用内存池和堆容量。
CONFIG_MEMORY=y
CONFIG_SYS_MEMORY_DEBUG=n
CONFIG_APP_USED_MEM_POOL=y
CONFIG_RAM_POOL_PAGE_NUM=9
CONFIG_HEAP_MEM_POOL_SIZE=2560

# 应用、主线程、UI、空闲线程与系统工作队列的栈大小，单位为字节。
CONFIG_APP_STACKSIZE=1536
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_UISRV_STACKSIZE=6144
CONFIG_IDLE_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# SDFS 和多卷管理，设置可打开文件的数量与磁盘 I/O 缓存开关。
CONFIG_SD_FS=y
CONFIG_SDFS_MANAGER=y
CONFIG_MUTIPLE_VOLUME_MANAGER=y
CONFIG_SD_FILE_MAX=24
CONFIG_DISKIO_CACHE=n

# 蓝牙主机、控制器、连接数、协议服务及调试。CONFIG_ACTS_BT_SHELL 控制蓝牙调试命令。
CONFIG_BLUETOOTH=y
CONFIG_ACTS_BT=y
CONFIG_ACTS_BT_SHELL=n
CONFIG_BT_BLE=y
CONFIG_BT_DRV=y
CONFIG_BT_ECC_ACTS=y
CONFIG_BT_HCI_ACTS=y
CONFIG_BT_CTRL_DEBUG=n
CONFIG_BT_CTRL_LOG=y
CONFIG_BT_CTRL_BQB=y
CONFIG_BT_CTRL_RF_DEBUG=n
CONFIG_BT_HCI_TX_PRINT=n
CONFIG_BT_HCI_RX_PRINT=n
CONFIG_HCI_DATA_LOG=y
CONFIG_BT_LOG_SERVICE=y
CONFIG_BT_BREDR=y
CONFIG_BT_CONN_TX_MAX=12
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
CONFIG_BT_ATT_ENFORCE_FLOW=n
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_BR_CONN=2
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_MAX_BR_PAIRED=2
CONFIG_BT_SPP=y
CONFIG_BT_PBAP_CLIENT=y
CONFIG_BT_MAP_CLIENT=y
CONFIG_BT_HID=y
CONFIG_BT_SDP_CLIENT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BAS=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_DEVICE_NAME="leopard_bt"
CONFIG_BT_RX_BUF_LEN=680
CONFIG_BT_RX_BUF_COUNT=25
CONFIG_BT_HCI_CMD_COUNT=4
CONFIG_BT_L2CAP_TX_MTU=672
CONFIG_BT_BLE_NOTIFY_PENDING=y
CONFIG_BT_BLE_APP_UPDATE_PARAM=y
CONFIG_BT_ANCS_AMS=y
CONFIG_BT_ACTIONS_SUPER_SERVICE=y

# 显示控制器、显示引擎、DMA2D 和显示工作队列。
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
CONFIG_DISPLAY_CONTROLLER=y
CONFIG_DISPLAY_ENGINE=y
CONFIG_DISPLAY_ENGINE_INSTANCE_NUM=4
CONFIG_DMA2D_HAL=y
CONFIG_DMA2D_LITE=y
CONFIG_DISPLAY_WORK_Q=y
CONFIG_DISPLAY_WORK_Q_STACK_SIZE=1536

# 嵌入式 C 库，选择 Newlib Nano 并启用浮点格式化输出。
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_NEWLIB_LIBC_NANO=y

# OTA 升级，选择前后台模式、数据来源、暂存分区与恢复机制。
CONFIG_OTA=y
CONFIG_OTA_UPGRADE=y
CONFIG_OTA_APP=y
CONFIG_OTA_BACKGROUND=n
CONFIG_OTA_FOREGROUND=y
CONFIG_OTA_BACKEND_SDCARD=y
CONFIG_OTA_BACKEND_BLUETOOTH=y
CONFIG_OTA_RECOVERY=y
CONFIG_OTA_STORAGE_FS=n
CONFIG_OTA_BACKEND_TEMP_PART=y
CONFIG_OTA_MUTIPLE_STORAGE=n
CONFIG_OTA_RES_PATCH=n

# 传感器管理与算法供应商选择。
CONFIG_SENSOR_MANAGER=y
CONFIG_SENSOR_ALGO_HR_GH30X=n
CONFIG_SENSOR_ALGO_HR_VCARE=n
CONFIG_SENSOR_ALGO_HR_HX3605=y
CONFIG_SENSOR_ALGO_HR_HX3690=n
CONFIG_SENSOR_ALGO_MOTION_CYWEE=y
CONFIG_SENSOR_ALGO_MOTION_CYWEE_DML=n
CONFIG_SENSOR_ALGO_MOTION_SILAN=n

# USB 设备栈与控制器，保留注释状态的配置供查阅。
CONFIG_USB_DEVICE=y
CONFIG_USB_AOTG_OTG=y
CONFIG_USB_AOTG_DC_ENABLED=y
CONFIG_USB_AOTG_OTG_VERSION=0x551A24CF
CONFIG_USB_DEVICE_DRIVER=y
CONFIG_USB_DEVICE_STACK=y
#CONFIG_SYS_LOG_USB_OTG_DRIVER_LEVEL=2
#CONFIG_SYS_LOG_USB_DEVICE_LEVEL=2
#CONFIG_USB_DEVICE_STRING_DESC_MAX_LEN=40
CONFIG_USB_AOTG_UDC_DMA=y
#CONFIG_MASS_STORAGE_SWITCH_TO_ADFU=n

# USB 大容量存储，使用默认描述符和端点设置的项目没有在此显式赋值。
CONFIG_USB_MASS_STORAGE=y
#CONFIG_SYS_LOG_USB_MASS_STORAGE_LEVEL=2
#CONFIG_MASS_STORAGE_MANUFACTURER="Actions"
#CONFIG_MASS_STORAGE_PRODUCT="MSC-Sample"
#CONFIG_MASS_STORAGE_SN="0123456798AB"
#CONFIG_MASS_STORAGE_STACK_SIZE=2048
#CONFIG_MASS_STORAGE_BUF_SIZE=8192
#CONFIG_USB_MASS_STORAGE_SHARE_THREAD=n
#CONFIG_USB_AOTG_DC_MULTI_FIFO=n
#CONFIG_MASS_STORAGE_IN_EP_ADDR=0x81
CONFIG_MASS_STORAGE_OUT_EP_ADDR=0x02

# USB CDC ACM 虚拟串口，以下候选设置均已注释。
#CONFIG_USB_CDC_ACM=y
#CONFIG_UART_LINE_CTRL=y
#CONFIG_SYS_LOG_USB_CDC_ACM_LEVEL=2
#CONFIG_CDC_ACM_INTERRUPT_EP_ADDR=0x81
#CONFIG_CDC_ACM_BULK_IN_EP_ADDR=0x84
#CONFIG_CDC_ACM_BULK_OUT_EP_ADDR=0x03
#CONFIG_USB_CDC_ACM_MANUFACTURER="Actions"
#CONFIG_USB_CDC_ACM_PRODUCT="CDC-ACM-DEV"
#CONFIG_USB_CDC_ACM_SN="0123456789A"

# PC 工具、ASET 和自动化测试入口的选择。
CONFIG_TOOL=y
CONFIG_TOOL_ASET=y
CONFIG_ACTIONS_ATT=n

# 随机操作测试，以及下方的其他可选应用与充电应用。
CONFIG_MONKEY_TEST=y

#CONFIG_ALIPAY_LIB=y
#CONFIG_MINIMAL_LIBC_MALLOC_ARENA_SIZE=10240

#CONFIG_NSM_APP=y
CONFIG_CHARGER_APP=y

# 应用使用自定义链接脚本 linker.ld 来安排固件各节。
CONFIG_HAVE_CUSTOM_LINKER_SCRIPT=y
CONFIG_CUSTOM_LINKER_SCRIPT="linker.ld"
